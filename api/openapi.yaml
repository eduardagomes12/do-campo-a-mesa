# Passo 5: especificação OpenAPI da API. Validar no Swagger Editor (https://editor.swagger.io).
# Está documentado apenas o recurso /products como exemplo.
# TODO: documentar /auth, /producers, /orders, /auctions, /reviews e /admin.

# Atualização do trabalho:
# /products e /producers já estão documentados.
# TODO: completar /auth, /orders, /auctions, /reviews e /admin.

openapi: 3.0.3

info:
  title: Do Campo à Mesa API
  version: 0.1.0
  description: API REST do mercado digital de produtores locais.

servers:
  - url: http://localhost:3000/api

paths:

  # ==========================================
  # PRODUTOS
  # ==========================================

  /products:
    get:
      tags: [Produtos]
      summary: Pesquisar produtos
      operationId: listarProdutos

      # Operação pública, sem autenticação.
      security: []

      parameters:
        - name: q
          in: query
          description: Pesquisar pelo nome ou descrição do produto e pelo nome do produtor
          schema:
            type: string

        - name: categoria
          in: query
          description: Filtrar por categoria
          schema:
            type: string
            enum:
              - Hortícolas
              - Fruta
              - Mel
              - Vinho
              - Queijo
              - Padaria
              - Outros

        - name: precoMax
          in: query
          description: Preço máximo do produto
          schema:
            type: number
            minimum: 0

        - name: bio
          in: query
          description: Mostrar apenas produtos biológicos
          schema:
            type: boolean

        - name: epoca
          in: query
          description: Filtrar pela época do ano
          schema:
            type: string
            enum:
              - Primavera
              - Verão
              - Outono
              - Inverno

        - name: produtor
          in: query
          description: Identificador MongoDB do produtor
          schema:
            type: string

        - name: localidade
          in: query
          description: Filtrar pela localidade da exploração do produtor
          schema:
            type: string


        - name: ordenar
          in: query
          description: Critério de ordenação
          schema:
            type: string
            enum: [recentes, preco_asc]
            default: recentes

      responses:
        '200':
          description: Lista de produtos
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'

        '400':
          description: Parâmetro de pesquisa inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

    post:
      tags: [Produtos]
      summary: Criar produto (produtor)
      operationId: criarProduto

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'

      responses:
        '201':
          description: Produto criado
          headers:
            Location:
              description: Endereço do produto criado
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '401':
          description: Token em falta ou inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '403':
          description: Utilizador não autorizado ou produtor não validado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador MongoDB do produto
        schema:
          type: string

    get:
      tags: [Produtos]
      summary: Detalhe de um produto
      operationId: obterProduto

      # Operação pública, sem autenticação.
      security: []

      responses:
        '200':
          description: Produto
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

        '400':
          description: Identificador inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '404':
          description: Não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

    put:
      tags: [Produtos]
      summary: Atualizar produto (produtor dono)
      operationId: atualizarProduto

      security:
        - bearerAuth: []

      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductInput'

      responses:
        '200':
          description: Produto atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'

        '400':
          description: Dados ou identificador inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '401':
          description: Token em falta ou inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '403':
          description: Utilizador não autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '404':
          description: Não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

    delete:
      tags: [Produtos]
      summary: Remover produto (produtor dono)
      operationId: removerProduto

      security:
        - bearerAuth: []

      responses:
        '204':
          description: Removido

        '400':
          description: Identificador inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '401':
          description: Token em falta ou inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '403':
          description: Utilizador não autorizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '404':
          description: Não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  # ==========================================
  # PRODUTORES
  # ==========================================

  /producers:
    get:
      tags: [Produtores]
      summary: Listar produtores aprovados
      operationId: listarProdutores

      # Operação pública, sem autenticação.
      security: []

      description: >
        Devolve os produtores aprovados pelo administrador.
        Permite filtrar pela localidade.

      parameters:
        - name: localidade
          in: query
          required: false
          description: Localidade do produtor
          schema:
            type: string
          example: Ponte de Lima

      responses:
        '200':
          description: Lista de produtores aprovados
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProdutorPublico'

        '400':
          description: Parâmetro de consulta inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /producers/{id}:
    get:
      tags: [Produtores]
      summary: Consultar perfil público de um produtor
      operationId: obterProdutor

      # Operação pública, sem autenticação.
      security: []

      description: >
        Devolve os dados do produtor, os seus produtos
        e a classificação média das avaliações visíveis.

      parameters:
        - name: id
          in: path
          required: true
          description: Identificador MongoDB do produtor
          schema:
            type: string
          example: 6af59c7ef4c8a86c59786076

      responses:
        '200':
          description: Perfil público do produtor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetalheProdutor'

        '400':
          description: Identificador inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '404':
          description: Produtor não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  # ==========================================
  # AUTENTICAÇÃO
  # ==========================================

  /auth/registo:
    post:
      tags: [Autenticação]
      summary: Registar comprador ou produtor
      operationId: registarUtilizador
      security: []

      description: >
        Regista um novo utilizador com papel comprador ou
        produtor. O papel admin não pode ser escolhido.
        Os produtores aguardam aprovação administrativa.

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistoInput'

      responses:
        '201':
          description: Utilizador registado
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string

        '400':
          description: Dados de registo inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '409':
          description: Email já registado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /auth/login:
    post:
      tags: [Autenticação]
      summary: Iniciar sessão
      operationId: iniciarSessao
      security: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'

      responses:
        '200':
          description: Sessão iniciada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sessao'

        '400':
          description: Dados inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '401':
          description: Credenciais inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /auth/eu:
    get:
      tags: [Autenticação]
      summary: Consultar utilizador autenticado
      operationId: obterUtilizadorAtual

      security:
        - bearerAuth: []

      responses:
        '200':
          description: Dados públicos do utilizador autenticado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Utilizador'

        '401':
          description: Token inválido ou em falta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'



  # ==========================================
  # ENCOMENDAS
  # ==========================================

  /orders:
    post:
      tags: [Encomendas]
      summary: Criar encomendas
      operationId: criarEncomendas

      description: >
        Permite a um comprador criar encomendas.
        O stock é reservado numa transação MongoDB.
        Os produtos são agrupados por produtor,
        criando uma encomenda para cada produtor.

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarEncomendaInput'

      responses:
        '201':
          description: Encomendas criadas com sucesso
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Encomenda'

        '400':
          description: Dados da encomenda inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '401':
          description: Token inválido ou em falta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '403':
          description: Utilizador não é comprador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '409':
          description: Stock insuficiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

    get:
      tags: [Encomendas]
      summary: Listar encomendas do utilizador
      operationId: listarEncomendas

      description: >
        Lista as encomendas associadas ao utilizador
        autenticado. O comprador consulta as suas compras
        e o produtor consulta as encomendas recebidas.

      security:
        - bearerAuth: []

      responses:
        '200':
          description: Lista de encomendas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Encomenda'

        '401':
          description: Token inválido ou em falta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /orders/{id}:
    get:
      tags: [Encomendas]
      summary: Consultar detalhe de uma encomenda
      operationId: obterEncomenda

      description: >
        Devolve a encomenda quando o utilizador
        autenticado é o comprador ou o produtor
        associado.

      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          description: Identificador MongoDB da encomenda
          schema:
            type: string

      responses:
        '200':
          description: Detalhe da encomenda
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Encomenda'

        '400':
          description: Identificador inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '401':
          description: Token inválido ou em falta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '404':
          description: Encomenda não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /orders/{id}/estado:
    patch:
      tags: [Encomendas]
      summary: Atualizar o estado de uma encomenda
      operationId: atualizarEstadoEncomenda

      description: >
        Permite ao produtor responsável avançar
        o estado de uma encomenda.
        Não é permitido regressar a um estado anterior.

      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          description: Identificador MongoDB da encomenda
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlterarEstadoEncomendaInput'

      responses:
        '200':
          description: Estado atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Encomenda'

        '400':
          description: Estado ou identificador inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '401':
          description: Token inválido ou em falta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '403':
          description: Utilizador não é produtor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '404':
          description: Encomenda não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '409':
          description: O estado não pode retroceder
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'



  # ==========================================
  # LEILÕES E LICITAÇÕES
  # ==========================================

  /auctions:
    get:
      tags: [Leilões]
      summary: Listar leilões
      operationId: listarLeiloes
      security: []

      description: >
        Devolve os leilões registados.
        Pode filtrar pelo estado.
        O encerramento automático dos leilões
        será implementado no Passo 7.

      parameters:
        - name: estado
          in: query
          required: false
          description: Estado do leilão
          schema:
            type: string
            enum: [agendado, ativo, terminado]

      responses:
        '200':
          description: Lista de leilões
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Leilao'

        '400':
          description: Pedido malformado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

    post:
      tags: [Leilões]
      summary: Criar um leilão
      operationId: criarLeilao

      description: >
        Permite a um produtor validado criar um leilão.
        O valor inicial corresponde ao preço base.
        A data de fim é calculada a partir do início
        e da duração indicada em minutos.

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CriarLeilaoInput'

      responses:
        '201':
          description: Leilão criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Leilao'

        '400':
          description: Dados ou datas inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '401':
          description: Token inválido ou em falta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '403':
          description: Produtor não autorizado ou não validado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '404':
          description: Produto associado não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /auctions/{id}:
    get:
      tags: [Leilões]
      summary: Consultar detalhe de um leilão
      operationId: obterLeilao
      security: []

      description: >
        Devolve os dados do leilão e as últimas
        20 licitações, ordenadas da mais recente
        para a mais antiga.

      parameters:
        - name: id
          in: path
          required: true
          description: Identificador MongoDB do leilão
          schema:
            type: string

      responses:
        '200':
          description: Detalhe do leilão
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DetalheLeilao'

        '400':
          description: Identificador inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '404':
          description: Leilão não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /auctions/{id}/bids:
    get:
      tags: [Leilões]
      summary: Consultar histórico de licitações
      operationId: listarLicitacoes
      security: []

      description: >
        Lista todas as licitações de um leilão,
        ordenadas da mais recente para a mais antiga.
        O registo de novas licitações será realizado
        por Socket.io no Passo 7.

      parameters:
        - name: id
          in: path
          required: true
          description: Identificador MongoDB do leilão
          schema:
            type: string

      responses:
        '200':
          description: Histórico de licitações
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Licitacao'

        '400':
          description: Identificador inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '404':
          description: Leilão não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

    


  # ==========================================
  # AVALIAÇÕES
  # ==========================================

  /reviews/minhas:
    get:
      tags: [Avaliações]
      summary: Consultar as avaliações do comprador autenticado
      operationId: listarMinhasAvaliacoes

      description: >
        Devolve as avaliações realizadas pelo comprador autenticado,
        ordenadas da mais recente para a mais antiga.
        Permite filtrar por encomenda e inclui avaliações
        de produtores e produtos.

      security:
        - bearerAuth: []

      parameters:
        - name: encomenda
          in: query
          required: false
          description: Identificador MongoDB da encomenda
          schema:
            type: string

      responses:
        '200':
          description: Lista de avaliações do comprador
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Avaliacao'

        '400':
          description: Identificador da encomenda inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '401':
          description: Token inválido ou em falta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '403':
          description: Apenas compradores podem consultar esta rota
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /reviews:
    get:
      tags: [Avaliações]
      summary: Listar avaliações visíveis
      operationId: listarAvaliacoes
      security: []

      description: >
        Devolve as avaliações públicas e visíveis,
        ordenadas da mais recente para a mais antiga.
        Permite filtrar por produtor ou produto.
        Inclui o nome do autor da avaliação.

      parameters:
        - name: produtor
          in: query
          required: false
          description: Identificador MongoDB do produtor
          schema:
            type: string

        - name: produto
          in: query
          required: false
          description: Identificador MongoDB do produto
          schema:
            type: string

      responses:
        '200':
          description: Lista de avaliações visíveis
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Avaliacao'

        '400':
          description: Identificador ou parâmetro inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

    post:
      tags: [Avaliações]
      summary: Criar avaliação de uma encomenda
      operationId: criarAvaliacao

      description: >
        Permite a um comprador avaliar um produtor
        ou produto associado a uma encomenda sua.
        A encomenda tem de estar entregue.
        A classificação deve ser um inteiro
        entre 1 e 5.

      security:
        - bearerAuth: []

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvaliacaoInput'

      responses:
        '201':
          description: Avaliação criada com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Avaliacao'

        '400':
          description: Dados inválidos ou produto fora da encomenda
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '401':
          description: Token inválido ou em falta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '403':
          description: Utilizador não é comprador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '404':
          description: Encomenda não encontrada ou não pertence ao comprador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '409':
          description: A encomenda ainda não foi entregue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /reviews/{id}/denuncia:
    post:
      tags: [Avaliações]
      summary: Denunciar uma avaliação
      operationId: denunciarAvaliacao

      description: >
        Permite a um utilizador autenticado denunciar
        uma avaliação. Incrementa o contador de
        denúncias da avaliação.
        A moderação é realizada pelo administrador.

      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          description: Identificador MongoDB da avaliação
          schema:
            type: string

      responses:
        '204':
          description: Denúncia registada, sem corpo de resposta

        '400':
          description: Identificador inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '401':
          description: Token inválido ou em falta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '404':
          description: Avaliação não encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'



  # ==========================================
  # ADMINISTRAÇÃO
  # ==========================================

  /admin/estatisticas:
    get:
      tags: [Administração]
      summary: Consultar estatísticas gerais
      operationId: obterEstatisticasAdmin

      description: >
        Devolve o número total de utilizadores,
        produtores, encomendas criadas hoje
        e leilões com estado ativo.
        Acesso exclusivo ao administrador.

      security:
        - bearerAuth: []

      responses:
        '200':
          description: Estatísticas gerais
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstatisticasAdmin'

        '401':
          description: Token inválido ou em falta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '403':
          description: Utilizador não é administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /admin/produtores/pendentes:
    get:
      tags: [Administração]
      summary: Listar produtores pendentes de validação
      operationId: listarProdutoresPendentes

      description: >
        Devolve os produtores que ainda não
        se encontram validados, ordenados
        por data de criação decrescente.

      security:
        - bearerAuth: []

      responses:
        '200':
          description: Lista de produtores pendentes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProdutorAdministracao'

        '401':
          description: Token inválido ou em falta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '403':
          description: Utilizador não é administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /admin/produtores/{id}/validacao:
    patch:
      tags: [Administração]
      summary: Aprovar ou rejeitar um produtor
      operationId: validarProdutor

      description: >
        Permite ao administrador definir se
        o produtor está aprovado.
        O campo aprovado deve ser booleano.

      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          description: Identificador MongoDB do produtor
          schema:
            type: string

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidacaoProdutorInput'

      responses:
        '200':
          description: Validação do produtor atualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProdutorAdministracao'

        '400':
          description: Identificador ou campo aprovado inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '401':
          description: Token inválido ou em falta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '403':
          description: Utilizador não é administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '404':
          description: Produtor não encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /admin/reviews/denunciadas:
    get:
      tags: [Administração]
