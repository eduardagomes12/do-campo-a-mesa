  # ==========================================
  # ESTADO DA API
  # ==========================================

  /health:
    get:
      tags: [Sistema]
      summary: Verificar o estado da API
      operationId: verificarEstadoAPI
      security: []

      description: >
        Permite verificar se o servidor Express
        está a responder corretamente.
        Não necessita de autenticação.

      responses:
        '200':
          description: Servidor operacional
          content:
            application/json:
              schema:
                type: object
                required: [estado]
                properties:
                  estado:
                    type: string
                    enum: [ok]
                    example: ok

        '4XX':
          description: Erro de pedido do cliente, quando aplicável

  # ==========================================
  # UPLOAD DE IMAGENS
  # ==========================================

  /products/{id}/imagem:
    post:
      tags: [Produtos]
      summary: Enviar imagem de um produto
      operationId: enviarImagemProduto

      description: >
        Permite a um produtor autenticado enviar
        a imagem de um produto.
        Utiliza multipart/form-data e o campo imagem.
        O limite configurado no Multer é de 5 MB.
        O armazenamento na Cloud será implementado
        no Passo 8. Atualmente, um pedido autorizado
        devolve HTTP 501.

      security:
        - bearerAuth: []

      parameters:
        - name: id
          in: path
          required: true
          description: Identificador MongoDB do produto
          schema:
            type: string

      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [imagem]
              properties:
                imagem:
                  type: string
                  format: binary
                  description: Ficheiro de imagem do produto

      responses:
        '200':
          description: >
            Imagem enviada com sucesso.
            Resposta prevista para o Passo 8.
          content:
            application/json:
              schema:
                type: object
                properties:
                  imagemUrl:
                    type: string
                    description: URL pública da imagem

        '400':
          description: Pedido ou ficheiro inválido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '401':
          description: Token inválido ou em falta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '403':
          description: Utilizador não é produtor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '501':
          description: >
            Upload ainda não implementado.
            Será desenvolvido no Passo 8.
          content:
            application/json:
              schema:
                type: object
                properties:
                  erro:
                    type: string
                    example: Por implementar
                  endpoint:
                    type: string
                    example: POST /api/products/507f1f77bcf86cd799439011/imagem
                  descricao:
                    type: string
                    example: Upload da imagem do produto




# ==========================================
# COMPONENTES REUTILIZÁVEIS
# ==========================================

components:

  # ==========================================
  # AUTENTICAÇÃO
  # ==========================================

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  # ==========================================
  # SCHEMAS
  # ==========================================

  schemas:

    # ----------------------------------------
    # RESPOSTAS DE ERRO
    # ----------------------------------------

    Erro:
      type: object
      properties:
        erro:
          type: string
          example: Produtor não encontrado

        detalhes:
          type: object
          additionalProperties: true

    # ----------------------------------------
    # PRODUTORES
    # ----------------------------------------

    ProdutorPublico:
      type: object
      properties:
        _id:
          type: string

        nome:
          type: string
          example: Horta da Ribeira

        produtor:
          type: object
          properties:
            nomeExploracao:
              type: string
              example: Horta da Ribeira

            descricao:
              type: string

            localidade:
              type: string
              example: Ponte de Lima

            localizacao:
              type: object
              properties:
                lat:
                  type: number

                lng:
                  type: number

            validado:
              type: boolean

            rejeitado:
              type: boolean

    DetalheProdutor:
      type: object
      properties:
        produtor:
          $ref: '#/components/schemas/ProdutorPublico'

        produtos:
          type: array
          items:
            $ref: '#/components/schemas/Product'

        avaliacaoMedia:
          type: number
          nullable: true
          minimum: 1
          maximum: 5
          example: 5

    # ----------------------------------------
    # PRODUTOS
    # ----------------------------------------

    ProductInput:
      type: object
      required:
        - nome
        - categoria
        - preco

      properties:
        nome:
          type: string
          example: Kiwi Hayward

        descricao:
          type: string
          example: Kiwi Hayward produzido em Ponte de Lima.

        categoria:
          type: string
          enum:
            - Hortícolas
            - Fruta
            - Mel
            - Vinho
            - Queijo
            - Padaria
            - Outros

        preco:
          type: number
          minimum: 0
          example: 2.4

        unidade:
          type: string
          example: kg
          default: kg

        stock:
          type: number
          minimum: 0
          example: 300

        biologico:
          type: boolean
          default: false

        epocas:
          type: array
          items:
            type: string
            enum:
              - Primavera
              - Verão
              - Outono
              - Inverno

    Product:
      allOf:
        - $ref: '#/components/schemas/ProductInput'

        - type: object
          properties:
            _id:
              type: string
              description: Identificador MongoDB do produto

            produtor:
              description: >
                Identificador do produtor ou objeto
                com os seus dados públicos.
              oneOf:
                - type: string
                - $ref: '#/components/schemas/ProdutorPublico'

            imagemUrl:
              type: string
              description: URL da imagem do produto

            createdAt:
              type: string
              format: date-time

            updatedAt:
              type: string
              format: date-time

    # ----------------------------------------
    # AUTENTICAÇÃO E UTILIZADORES
    # ----------------------------------------

    RegistoInput:
      type: object
      required: [nome, email, password, papel]
      properties:
        nome:
          type: string
          example: Maria Silva

        email:
          type: string
          format: email
          example: maria@exemplo.pt

        password:
          type: string
          format: password
          writeOnly: true

        papel:
          type: string
          enum: [comprador, produtor]

        produtor:
          type: object
          description: Dados adicionais para contas de produtor
          properties:
            nomeExploracao:
              type: string

            descricao:
              type: string

            localidade:
              type: string

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: maria@exemplo.pt

        password:
          type: string
          format: password
          writeOnly: true

    Utilizador:
      type: object
      properties:
        id:
          type: string

        nome:
          type: string

        email:
          type: string
          format: email

        papel:
          type: string
          enum: [comprador, produtor, admin]

        produtor:
          type: object
          properties:
            nomeExploracao:
              type: string

            descricao:
              type: string

            localidade:
              type: string

            validado:
              type: boolean

            rejeitado:
              type: boolean

    Sessao:
      type: object
      properties:
        token:
          type: string
          description: Token JWT de autenticação

        utilizador:
          $ref: '#/components/schemas/Utilizador'



    # ----------------------------------------
    # ENCOMENDAS
    # ----------------------------------------

    LinhaEncomendaInput:
      type: object
      required: [produto, quantidade]
      properties:
        produto:
          type: string
          description: Identificador MongoDB do produto

        quantidade:
          type: number
          minimum: 1
          example: 2

    EntregaEncomenda:
      type: object
      properties:
        tipo:
          type: string
          enum: [levantamento, entrega]
          default: levantamento

        morada:
          type: string
          description: Morada quando o tipo é entrega

    CriarEncomendaInput:
      type: object
      required: [linhas]

      properties:
        linhas:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/LinhaEncomendaInput'

        entrega:
          $ref: '#/components/schemas/EntregaEncomenda'

      example:
        linhas:
          - produto: "6af59c7ef4c8a86c5978607d"
            quantidade: 2
        entrega:
          tipo: levantamento

    LinhaEncomenda:
      type: object
      properties:
        produto:
          type: string

        nome:
          type: string
          example: Kiwi Hayward

        precoUnit:
          type: number
          minimum: 0
          example: 2.4

        unidade:
          type: string
          example: kg

        quantidade:
          type: number
          minimum: 1
          example: 2

    Encomenda:
      type: object
      properties:
        _id:
          type: string

        comprador:
          type: string
          description: Identificador MongoDB do comprador

        produtor:
          type: string
          description: Identificador MongoDB do produtor

        linhas:
          type: array
          items:
            $ref: '#/components/schemas/LinhaEncomenda'

        estado:
          type: string
          enum:
            - pendente
            - confirmada
            - pronta
            - entregue
          default: pendente

        entrega:
          $ref: '#/components/schemas/EntregaEncomenda'

        origem:
          type: string
          enum: [loja, leilao]
          default: loja

        leilao:
          type: string
          description: Identificador do leilão, quando aplicável

        total:
          type: number
          description: Total calculado a partir das linhas
          example: 4.8

        createdAt:
          type: string
          format: date-time

        updatedAt:
          type: string
          format: date-time

    AlterarEstadoEncomendaInput:
      type: object
      required: [estado]
      properties:
        estado:
          type: string
          enum:
            - pendente
            - confirmada
            - pronta
            - entregue
          example: confirmada



    # ----------------------------------------
    # LEILÕES E LICITAÇÕES
    # ----------------------------------------

    CriarLeilaoInput:
      type: object
      required:
        - lote
        - precoBase
        - incremento
        - duracao

      properties:
        produto:
          type: string
          description: >
            Identificador MongoDB do produto associado.
            Campo opcional.

        lote:
          type: string
          maxLength: 150
          example: 200 kg de kiwi Hayward, calibre A

        quantidade:
          type: string
          example: 200 kg

        precoBase:
          type: number
          minimum: 0
          example: 200

        incremento:
          type: number
          minimum: 0.01
          example: 5

        iniciaEm:
          type: string
          format: date-time
          description: >
            Data de início do leilão.
            Se omitida, utiliza a data atual.

        duracao:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: Duração do leilão em minutos
          example: 30

      example:
        produto: "6af59c7ef4c8a86c5978607d"
        lote: 200 kg de kiwi Hayward, calibre A
        quantidade: 200 kg
        precoBase: 200
        incremento: 5
        duracao: 30

    LicitacaoAtual:
      type: object
      properties:
        valor:
          type: number
          minimum: 0
          example: 200

        comprador:
          type: string
          description: Identificador do comprador

        nome:
          type: string
          description: Nome do comprador

        em:
          type: string
          format: date-time
          description: Data da última licitação

    Leilao:
      type: object
      properties:
        _id:
          type: string

        produtor:
          description: >
            Identificador do produtor ou objeto
            com os seus dados públicos.
          oneOf:
            - type: string
            - $ref: '#/components/schemas/ProdutorPublico'

        produto:
          type: string
          description: Identificador do produto associado

        lote:
          type: string
          example: 200 kg de kiwi Hayward, calibre A

        descricao:
          type: string
          description: Descrição adicional do lote

        quantidade:
          type: string
          example: 200 kg

        precoBase:
          type: number
          example: 200

        incremento:
          type: number
          example: 5

        licitacaoAtual:
          $ref: '#/components/schemas/LicitacaoAtual'

        numLicitacoes:
          type: integer
          minimum: 0
          default: 0

        iniciaEm:
          type: string
          format: date-time

        terminaEm:
          type: string
          format: date-time

        estado:
          type: string
          enum:
            - agendado
            - ativo
            - terminado

        encomenda:
          type: string
          description: >
            Identificador da encomenda criada
            para o vencedor, quando aplicável.

        createdAt:
          type: string
          format: date-time

        updatedAt:
          type: string
          format: date-time

    Licitacao:
      type: object
      properties:
        _id:
          type: string

        leilao:
          type: string
          description: Identificador do leilão

        comprador:
          type: string
          description: Identificador do comprador

        nome:
          type: string
          description: Nome do comprador no histórico

        valor:
          type: number
          example: 205

        createdAt:
          type: string
          format: date-time

        updatedAt:
          type: string
          format: date-time

    DetalheLeilao:
      type: object
      properties:
        leilao:
          $ref: '#/components/schemas/Leilao'

        licitacoes:
          type: array
          description: Últimas 20 licitações do leilão
          items:
            $ref: '#/components/schemas/Licitacao'


    # ----------------------------------------
    # AVALIAÇÕES
    # ----------------------------------------

    AvaliacaoInput:
      type: object
      required:
        - encomenda
        - classificacao

      properties:
        encomenda:
          type: string
          description: >
            Identificador MongoDB da encomenda
            entregue e pertencente ao comprador.

        produto:
          type: string
          description: >
            Identificador opcional de um produto
            pertencente à encomenda.

        classificacao:
          type: integer
          minimum: 1
          maximum: 5
          example: 5

        comentario:
          type: string
          example: >
            Produtos frescos e de excelente qualidade.

    Avaliacao:
      type: object
      properties:
        _id:
          type: string
          description: Identificador MongoDB da avaliação

        autor:
          description: >
            Identificador do autor ou objeto com
            os seus dados públicos na listagem.
          oneOf:
            - type: string
            - type: object
              properties:
                _id:
                  type: string
                nome:
                  type: string

        produtor:
          type: string
          description: Identificador MongoDB do produtor

        produto:
          type: string
          description: >
            Identificador do produto avaliado,
            quando aplicável.

        encomenda:
          type: string
          description: >
            Identificador da encomenda
            associada à avaliação.

        classificacao:
          type: integer
          minimum: 1
          maximum: 5
          example: 5

        comentario:
          type: string
          example: >
            Produtos frescos e de excelente qualidade.

        denuncias:
          type: integer
          minimum: 0
          default: 0

        visivel:
          type: boolean
          default: true

        createdAt:
          type: string
          format: date-time

        updatedAt:
          type: string
          format: date-time



    # ----------------------------------------
    # ADMINISTRAÇÃO
    # ----------------------------------------

    EstatisticasAdmin:
      type: object
      properties:
        utilizadores:
          type: integer
          minimum: 0
          description: Total de utilizadores registados

        produtores:
          type: integer
          minimum: 0
          description: Total de utilizadores com papel produtor

        encomendasHoje:
          type: integer
          minimum: 0
          description: Encomendas criadas durante o dia atual

        leiloesAtivos:
          type: integer
          minimum: 0
          description: Leilões com estado ativo

    ProdutorAdministracao:
      type: object
      properties:
        _id:
          type: string
          description: Identificador MongoDB do produtor

        nome:
          type: string
          example: Maria Silva

        email:
          type: string
          format: email
          example: maria@exemplo.pt

        produtor:
          type: object
          properties:
            nomeExploracao:
              type: string

            descricao:
              type: string

            localidade:
              type: string

            localizacao:
              type: object
              properties:
                lat:
                  type: number

                lng:
                  type: number

            validado:
              type: boolean
              default: false

            rejeitado:
              type: boolean
              description: >
                Indicador de rejeição, quando presente
                na versão atual do modelo.

        createdAt:
          type: string
          format: date-time

    ValidacaoProdutorInput:
      type: object
      required: [aprovado]
      properties:
        aprovado:
          type: boolean
          description: >
            true para aprovar o produtor;
            false para não aprovar.
          example: true

    VisibilidadeAvaliacaoInput:
      type: object
      required: [visivel]
      properties:
        visivel:
          type: boolean
          description: >
            true para mostrar a avaliação;
            false para ocultar.
          example: false

    AvaliacaoDenunciada:
      type: object
      properties:
        _id:
          type: string

        autor:
          type: object
          nullable: true
          properties:
            _id:
              type: string
            nome:
              type: string

        produtor:
          type: object
          nullable: true
          properties:
            _id:
              type: string
            nome:
              type: string
            produtor:
              type: object
              properties:
                nomeExploracao:
                  type: string

        produto:
          type: string
          nullable: true

        encomenda:
          type: string
          nullable: true

        classificacao:
          type: integer
          minimum: 1
          maximum: 5

        comentario:
          type: string

        denuncias:
          type: integer
          minimum: 1

        visivel:
          type: boolean

        createdAt:
          type: string
          format: date-time

        updatedAt:
          type: string
          format: date-time




    # TODO: User, Order, Auction, Bid, Review, Erro
    # Atualização: o schema Erro já está documentado.
    # Os restantes schemas serão acrescentados nas próximas etapas.
