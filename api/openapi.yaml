        '401':
          description: Token inválido ou em falta
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

        '403':
          description: Utilizador não é administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Erro'

  /admin/reviews/{id}:
    patch:
